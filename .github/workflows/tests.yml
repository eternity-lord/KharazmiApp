# CI — اجرای خودکار سوئیت تست پروژهٔ آموزشگاه (تصمیم B2 سند checkpoints/2026-09-20-open-decisions.md)
#
# چرا: پیش از این هیچ CI نبود؛ یعنی «۵ failure وابسته به پوشهٔ اجرا» (که در Task 6 و سپس B1 فیکس شد)
# می‌توانست هفته‌ها بی‌سروصدا بماند و رگرسیون‌ها فقط وقتی دیده شوند که کسی دستی تست را اجرا کند.
#
# چه چیزی اجرا می‌شود:
#   ۱) کل سوئیت از **ریشهٔ ریپو** با **DB موقت** (sqlite در /tmp) — هیچ ارتباطی با DB واقعی آموزشگاه نیست.
#   ۲) یک سنجش مستقلِ «مستقل‌بودن از پوشهٔ اجرا» از داخل Kharazmi_Server/ (قفلِ فیکس B1).
#   ۳) گارد یکپارچگی: md5 فایل `Kharazmi_Server/gaj_db.db` قبل و بعد از تست‌ها باید یکی باشد
#      (قانون پروژه: DB واقعی هرگز در تست دست‌کاری نمی‌شود).
#
# توجه: تریگر عمداً فقط push روی شاخه‌های کاری و اجرای دستی است (بدون pull_request) تا PR #1
# باز و دست‌نخورده بماند — ساخت/بررسی PR فقط با دستور صریح کاربر.

name: tests

on:
  push:
    branches:
      - main
      - arena/01a0bf8d-kharazmiapp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (repo root + temp DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # DB موقت: هیچ تستی به دیتابیس واقعی آموزشگاه دست نمی‌زند
      DATABASE_URL: sqlite:////tmp/kharazmi_ci.db
      # راز صرفاً برای همین اجرا (تست‌ها به کلید واقعی نیاز ندارند)
      JWT_SECRET_KEY: ci-only-test-secret-not-production
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Kharazmi_Server/requirements.txt

      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r Kharazmi_Server/requirements.txt pytest

      - name: Record real DB checksum (before)
        run: |
          echo "DB_BEFORE=$(md5sum Kharazmi_Server/gaj_db.db | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Run full suite from repository root
        run: python -m pytest Kharazmi_Server -q

      - name: Run suite from inside Kharazmi_Server (cwd-independence guard, B1)
        working-directory: Kharazmi_Server
        run: python -m pytest test_audit.py test_dashboard.py test_dashboard_performance.py test_suite_cwd_independence.py -q

      - name: Guard - real institute database untouched
        run: |
          after=$(md5sum Kharazmi_Server/gaj_db.db | cut -d' ' -f1)
          echo "checksum before: $DB_BEFORE"
          echo "checksum after : $after"
          if [ "$DB_BEFORE" != "$after" ]; then
            echo "::error::دیتابیس واقعی آموزشگاه در تست‌ها تغییر کرده است — این نقض قانون پروژه است."
            exit 1
          fi
          echo "✅ دیتابیس واقعی دست‌نخورده ماند."
